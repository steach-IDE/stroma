name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The baseline every session starts from: the harness and every package that exists.
  baseline:
    name: baseline
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
      - name: Pinned fonts (downloaded once, keyed on their hashes)
        uses: actions/cache@v4
        with:
          path: .stroma/fonts
          key: fonts-${{ hashFiles('tool/fonts.sha256') }}
      - name: ./init.sh
        run: ./init.sh
      - name: Keep the Linux renders when a golden test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: examples/*/packages/*/test/failures/
          if-no-files-found: ignore

  work:
    name: work rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The issue link and the commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: .github/scripts/work-gate.sh

  # The one check to require: green when every job that ran passed (skipped jobs are fine).
  all-green:
    name: all green
    if: always() && github.event.action != 'edited'
    needs: [baseline, work]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "A job ended as: $r"; exit 1 ;; esac
          done
